<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="900" viewBox="0 0 1860 900" role="img" aria-label="System architecture for MMASD skeleton-based activity recognition">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#315879"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#315879; stroke-width:2.5; rx:14; }
      .outer { fill:#ffffff; stroke:#7890a5; stroke-width:2; rx:18; }
      .arrow { fill:none; stroke:#315879; stroke-width:3; marker-end:url(#arrow); }
      .line { fill:none; stroke:#315879; stroke-width:2.5; }
      .title { font:700 25px Arial, sans-serif; fill:#18344c; text-anchor:middle; }
      .sub { font:18px Arial, sans-serif; fill:#253746; text-anchor:middle; }
      .small { font:16px Arial, sans-serif; fill:#34495a; text-anchor:middle; }
      .bandtitle { font:700 22px Arial, sans-serif; fill:#18344c; }
      .step { font:700 19px Arial, sans-serif; fill:#18344c; text-anchor:middle; }
    </style>
  </defs>

  <!-- Main data and model flow -->
  <rect class="box" x="40" y="145" width="245" height="170"/>
  <text class="title" x="162" y="185">MMASD input</text>
  <text class="sub" x="162" y="222">Skeleton sequence X</text>
  <text class="small" x="162" y="252">64 frames × 25 joints × 4 features</text>
  <text class="sub" x="162" y="285">Confidence Q (separate)</text>

  <rect class="box" x="335" y="90" width="220" height="120"/>
  <text class="title" x="445" y="130">Feature projection</text>
  <text class="sub" x="445" y="166">4 input features → 64-D</text>
  <text class="small" x="445" y="192">per joint and frame</text>

  <rect class="box" x="335" y="255" width="220" height="135"/>
  <text class="title" x="445" y="295">Joint reliability</text>
  <text class="sub" x="445" y="333">Confidence + motion</text>
  <text class="small" x="445" y="363">training-fitted motion prior</text>

  <!-- Spatial graph processing group -->
  <rect class="outer" x="610" y="68" width="455" height="345"/>
  <text class="title" x="837" y="105">Spatial graph layers × 2</text>
  <rect class="box" x="635" y="128" width="405" height="65"/>
  <text class="sub" x="837" y="156">BODY_25 anatomical graph attention</text>
  <text class="small" x="837" y="180">fixed anatomical connections</text>
  <rect class="box" x="635" y="207" width="405" height="78"/>
  <text class="sub" x="837" y="237">Bilateral edge learner</text>
  <text class="small" x="837" y="261">selected left–right joint pairs</text>
  <text class="small" x="837" y="280">edge smoothing, K = 5 (when enabled)</text>
  <rect class="box" x="635" y="291" width="405" height="96"/>
  <text class="sub" x="837" y="320">Reliability handling varies by configuration</text>
  <text class="small" x="837" y="347">A2: bilateral reliability gate</text>
  <text class="small" x="837" y="371">A7: reliability input to edge learner</text>

  <rect class="box" x="1110" y="135" width="215" height="150"/>
  <text class="title" x="1217" y="176">Joint pooling</text>
  <text class="sub" x="1217" y="215">reliability-weighted</text>
  <text class="small" x="1217" y="249">one vector per frame</text>

  <rect class="box" x="1370" y="135" width="220" height="150"/>
  <text class="title" x="1480" y="176">Temporal attention</text>
  <text class="sub" x="1480" y="215">self-attention × 2</text>
  <text class="small" x="1480" y="249">over 64 frame vectors</text>

  <rect class="box" x="1370" y="465" width="220" height="110"/>
  <text class="title" x="1480" y="507">Temporal mean</text>
  <text class="sub" x="1480" y="541">sequence pooling</text>

  <rect class="box" x="1080" y="465" width="235" height="110"/>
  <text class="title" x="1197" y="507">Linear classifier</text>
  <text class="sub" x="1197" y="541">10 activity scores</text>

  <rect class="box" x="800" y="465" width="225" height="110"/>
  <text class="title" x="912" y="507">Activity output</text>
  <text class="sub" x="912" y="541">calibrated prediction</text>

  <!-- Connectors: data branches -->
  <path class="arrow" d="M285 190 C305 190 310 150 335 150"/>
  <path class="arrow" d="M285 270 C305 270 310 322 335 322"/>
  <path class="arrow" d="M555 150 C580 150 585 160 610 160"/>
  <path class="arrow" d="M555 322 C580 322 585 345 610 345"/>
  <path class="arrow" d="M1065 210 L1110 210"/>
  <path class="arrow" d="M1325 210 L1370 210"/>
  <path class="arrow" d="M1480 285 L1480 465"/>
  <path class="arrow" d="M1370 520 L1315 520"/>
  <path class="arrow" d="M1080 520 L1025 520"/>
  <path class="arrow" d="M555 345 L585 430 L1080 430 L1080 265 L1110 265"/>

  <!-- Cohort-grouped evaluation workflow -->
  <rect class="outer" x="40" y="630" width="1780" height="225"/>
  <text class="bandtitle" x="70" y="670">Cohort-grouped evaluation</text>

  <rect class="box" x="70" y="700" width="300" height="115"/>
  <text class="step" x="220" y="744">Five-fold split</text>
  <text class="small" x="220" y="779">by recording cohort</text>

  <rect class="box" x="420" y="700" width="300" height="115"/>
  <text class="step" x="570" y="744">Fit on training data</text>
  <text class="small" x="570" y="779">preprocessing + model</text>

  <rect class="box" x="770" y="700" width="300" height="115"/>
  <text class="step" x="920" y="744">Validate</text>
  <text class="small" x="920" y="779">selection + calibration</text>

  <rect class="box" x="1120" y="700" width="300" height="115"/>
  <text class="step" x="1270" y="744">Test held-out cohorts</text>
  <text class="small" x="1270" y="779">one fold at a time</text>

  <rect class="box" x="1470" y="700" width="300" height="115"/>
  <text class="step" x="1620" y="744">Aggregate predictions</text>
  <text class="small" x="1620" y="779">metrics across folds</text>

  <path class="arrow" d="M370 757 L420 757"/>
  <path class="arrow" d="M720 757 L770 757"/>
  <path class="arrow" d="M1070 757 L1120 757"/>
  <path class="arrow" d="M1420 757 L1470 757"/>

  <text class="small" x="930" y="885">Cohort identifiers were not verified as participant identities.</text>
</svg>
